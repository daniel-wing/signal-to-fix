# Signal-to-Fix configuration.
# Everything you might want to change during a demo lives here or in prompt.txt.
# Both files are read again on every run. No code edits needed.

# Local masking model (runs on this machine, never sends data out).
# Server and Mac both use Ollama on its default port.
ollama:
  url: http://localhost:11434
  model: qwen2.5:3b
  timeout_seconds: 90

# Cloud classifier. Receives masked text only.
# backend: claude_code uses the Claude Code CLI installed on this machine (subscription login).
#          api uses the Anthropic API with the key named below in .env.
llm:
  backend: claude_code
  cli: claude                      # Claude Code command; change it to break the call on purpose
  model: claude-sonnet-5-5
  api_key_env: ANTHROPIC_API_KEY   # only for backend: api; name of the variable, never the key itself
  effort: low                      # low | medium | high
  max_tokens: 4000
  timeout_seconds: 90

# Routing (A6: demo policy, not validated; confidence is self-reported by the model).
routing:
  auto_tag_min_confidence: 0.85    # at or above: auto-tag
  review_min_confidence: 0.60      # 0.60 to below 0.85: review queue; below 0.60: human-led
  secondary_owner_min_score: 0.50  # any other P above this also gets an owner
  # Any of these words forces human-led handling. Matched on the masked text,
  # lowercase, accents ignored. Add a line to add a word.
  risk_words:
    # fraud
    - fraude
    - fraud
    - estafa
    - suplantacion
    # unrecognized charge
    - no reconozco
    - cargo desconocido
    - cargos desconocidos
    - no autorice
    - no fui yo
    # account takeover
    - hackearon
    - hackeo
    - alguien entro
    - alguien mas entro
    - cambiaron mi correo
    - cambiaron mi telefono
    - robaron
    # lockout
    - cuenta bloqueada
    - bloquearon mi cuenta
    - me bloquearon
    - bloqueo de cuenta
    # legal
    - abogado
    - demanda
    - denuncia
    - profeco
    - procon
    - superintendencia
    - accion legal

# Early warning (A5).
alerts:
  recent_days: 3                   # the last 3 days
  baseline_days: 27                # compared with the 27 days before
  min_ratio: 2.0                   # recent share at least 2x the baseline share
  min_recent_cases: 3              # and at least this many cases in the recent window

# Evaluation gate (A7).
eval:
  accuracy_gate: 0.85

server:
  host: 127.0.0.1
  port: 8000

paths:
  cases: cases_raw.json
  prompt: prompt.txt
  vault: vault.json
  results: results/latest.json
  eval_runs: eval_runs
