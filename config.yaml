# Signal-to-Fix configuration.
# Everything you might want to change during a demo lives here. No code edits needed.

# Local masking model (runs on this machine, never sends data out).
# Server: http://localhost:11434   Mac: http://localhost:11434 (Ollama for Mac)
ollama:
  url: http://localhost:11434
  model: qwen2.5:3b
  timeout_seconds: 90

# Cloud classifier. Receives masked text only.
llm:
  provider: anthropic
  url: https://api.anthropic.com/v1/messages
  model: claude-sonnet-5-5
  api_key_env: ANTHROPIC_API_KEY   # name of the environment variable, never the key itself
  max_tokens: 1200
  timeout_seconds: 60
  retries: 3                       # attempts before a case is queued for retry
  backoff_seconds: 2
  parallel_requests: 4

# Routing thresholds (assumptions, tune after shadow mode).
routing:
  auto_tag_min_confidence: 0.85    # at or above this, and no risk: auto-tag
  review_min_confidence: 0.60      # 0.60 to 0.85: human review queue; below: human-led
  ambiguity_alt_confidence: 0.30   # activation vs decline: second guess this strong goes to review
  secondary_owner_min_score: 0.50  # any other P above this also gets routed
  risk_categories: [account_access]
  # Words that force human-led handling. Matched on masked text, lowercase, accents ignored.
  risk_words:
    - fraude
    - no reconozco
    - no fui yo
    - no lo hice yo
    - hackearon
    - hackeo
    - robo
    - robaron
    - suplantacion
    - alguien entro
    - alguien mas entro
    - cargo desconocido
    - cargos desconocidos
  # Account-access cases are only risk when they show takeover signals.
  access_takeover_words:
    - no fui yo
    - alguien entro
    - alguien mas entro
    - cambiaron mi correo
    - cambiaron mi telefono
    - codigo que no pedi
    - no reconozco

# Early warning (simple, editable rule).
alerts:
  as_of: "2026-10-20"              # "today" for the demo data
  recent_days: 3
  baseline_days: 30
  min_ratio: 2.0                   # recent share at least 2x the 30-day share
  min_recent_cases: 3              # and at least this many cases in the recent window
  cluster_similarity: 0.5          # word overlap needed to group two emerging themes

server:
  host: 127.0.0.1                  # use 0.0.0.0 only on a trusted network
  port: 8000

paths:
  cases: cases_raw.json
  prompt: prompt.txt
  reference_examples: reference_examples.json
  vault: vault.json
  queue: queue.json
  results: outputs/results.json
  evals_dir: evals
